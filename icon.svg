<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#03a9f4"/>
      <stop offset="60%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="60%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <linearGradient id="leafLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#43a047"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0288d1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle Tile -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#tileGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#0288d1" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Ripple Waves at base -->
  <ellipse cx="256" cy="425" rx="140" ry="24" fill="none" stroke="#4fc3f7" stroke-width="3" stroke-opacity="0.25"/>
  <ellipse cx="256" cy="425" rx="90" ry="16" fill="none" stroke="#4fc3f7" stroke-width="4" stroke-opacity="0.5"/>
  <ellipse cx="256" cy="425" rx="45" ry="9" fill="none" stroke="#4fc3f7" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Main Water Droplet with Glow -->
  <path d="M 256,95 
           C 256,95 385,245 385,320 
           A 129,129 0 0,1 127,320 
           C 127,245 256,95 256,95 Z" 
        fill="url(#dropGrad)" 
        filter="url(#glow)"/>

  <!-- Inner Droplet Translucent Highlight -->
  <path d="M 256,125 
           C 256,125 365,255 365,320 
           A 109,109 0 0,1 147,320 
           C 147,255 256,125 256,125 Z" 
        fill="#ffffff" 
        fill-opacity="0.12"/>

  <!-- Plant Stem -->
  <path d="M 256,365 Q 256,310 256,265" 
        fill="none" 
        stroke="#e8f5e9" 
        stroke-width="7" 
        stroke-linecap="round"/>

  <!-- Right Sprout Leaf -->
  <path d="M 256,295 C 285,285 330,245 325,205 C 285,210 265,255 256,285 Z" 
        fill="url(#leafGrad)"/>

  <!-- Left Sprout Leaf -->
  <path d="M 256,315 C 230,305 185,280 185,245 C 220,248 245,285 256,310 Z" 
        fill="url(#leafLeftGrad)"/>

  <!-- Center Sprout Bud -->
  <circle cx="256" cy="265" r="5" fill="#a5d6a7"/>
</svg>
