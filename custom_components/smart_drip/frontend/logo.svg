<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <linearGradient id="logoDropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#03a9f4"/>
      <stop offset="60%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <linearGradient id="logoLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="60%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <linearGradient id="logoLeafLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#43a047"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0288d1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1024" height="512" fill="url(#bgGrad)"/>

  <!-- Left Icon Emblem Group -->
  <g transform="translate(40, 20)">
    <!-- Base Ripples -->
    <ellipse cx="236" cy="405" rx="130" ry="20" fill="none" stroke="#4fc3f7" stroke-width="3" stroke-opacity="0.25"/>
    <ellipse cx="236" cy="405" rx="80" ry="14" fill="none" stroke="#4fc3f7" stroke-width="4" stroke-opacity="0.5"/>
    <ellipse cx="236" cy="405" rx="40" ry="8" fill="none" stroke="#4fc3f7" stroke-width="4" stroke-opacity="0.8"/>

    <!-- Water Droplet -->
    <path d="M 236,85 
             C 236,85 360,230 360,300 
             A 124,124 0 0,1 112,300 
             C 112,230 236,85 236,85 Z" 
          fill="url(#logoDropGrad)" 
          filter="url(#logoGlow)"/>

    <!-- Inner Highlight -->
    <path d="M 236,115 
             C 236,115 340,240 340,300 
             A 104,104 0 0,1 132,300 
             C 132,240 236,115 236,115 Z" 
          fill="#ffffff" 
          fill-opacity="0.12"/>

    <!-- Plant Stem -->
    <path d="M 236,345 Q 236,295 236,250" 
          fill="none" 
          stroke="#e8f5e9" 
          stroke-width="7" 
          stroke-linecap="round"/>

    <!-- Right Leaf -->
    <path d="M 236,280 C 265,270 305,230 300,195 C 265,200 245,240 236,270 Z" 
          fill="url(#logoLeafGrad)"/>

    <!-- Left Leaf -->
    <path d="M 236,300 C 210,290 170,265 170,235 C 205,238 225,270 236,295 Z" 
          fill="url(#logoLeafLeftGrad)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(460, 220)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="800" letter-spacing="-1">
      <tspan fill="#03a9f4">Smart</tspan>
      <tspan fill="#4caf50" dx="18">Drip</tspan>
    </text>
    <text y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#90caf9">
      INTELLIGENT MICRO-IRRIGATION
    </text>
    <text y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#78909c">
      FAO-56 ET₀ Math Engine • Hardware Interlocks • Solenoid Protection
    </text>
  </g>
</svg>
